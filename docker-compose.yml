services:
  # Development server with hot reload: `docker compose up --build` → http://localhost:3002
  # (host port overridable: `APP_PORT=4010 docker compose up`).
  app:
    build:
      context: .
      target: dev
    image: bangladesh-healthcare-search:dev
    ports:
      - "${APP_PORT:-3002}:3000"
    # Values come from an optional .env file (see .env.example) via variable substitution,
    # which works with both `docker compose` (v2) and the legacy `docker-compose` (v1).
    # A missing .env is fine: every variable defaults to empty.
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
      NEXT_PUBLIC_GOOGLE_MAPS_EMBED_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_EMBED_API_KEY:-}
      NEXT_PUBLIC_REPORT_URL: ${NEXT_PUBLIC_REPORT_URL:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GOOGLE_PLACES_LIVE_DETAILS: ${GOOGLE_PLACES_LIVE_DETAILS:-}
      # Uncomment if file changes are not detected (e.g. Docker Desktop on macOS/Windows):
      # WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      # Keep container-installed dependencies and build cache out of the host folder.
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  # Production image, for verifying the real build locally:
  # `docker compose --profile prod up --build web`
  web:
    profiles: ["prod"]
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    image: bangladesh-healthcare-search:prod
    ports:
      - "${WEB_PORT:-3001}:3000"

volumes:
  node_modules:
  next_cache:
